{% extends "accounts/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
  <h1 class="h3 mb-3">Change password</h1>
  <div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
      {% include "accounts/_form_errors.html" %}
      {% for field in form %}{% include "accounts/_field.html" with field=field %}{% endfor %}
      <button type="submit" class="btn btn-primary">Change password</button>
      <a href="{% url 'accounts:home' %}" class="btn btn-link">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
